[project]
name = "notes-app"
version = "0.1.0"
description = "Notes REST API with FastAPI, PostgreSQL and JWT auth"
authors = [
    { name = "Sahar", email = "134833565+saharrx@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
